name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing in this workflow writes to the repository, and
# no job widens this.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, validator, scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to the commit SHA of a release tag, not
      # to the tag itself. A tag can be moved to point at different code; a
      # commit SHA cannot. The tag in each comment is the release the SHA came
      # from, recorded in docs/decision-log.md.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      # Scout has no runtime dependencies, so this installs the lockfile's dev
      # tree only and there is nothing worth caching.
      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow clone would leave most of the
          # history unscanned and still report success.
          fetch-depth: 0
          persist-credentials: false

      # Pinned rather than relying on whatever Node the runner ships, so the
      # gate below runs on the same version as the rest of the project.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      # The history walk lives here because it needs the full clone the secret
      # scan already requires. The tree check runs in the other job as part of
      # `npm run check`, where a shallow clone is enough.
      #
      # --strict-history additionally insists the repository is not shallow and
      # that no accepted exception has appeared. This repository begins at one
      # commit whose tree was gated before it existed, so a clean history is a
      # property to keep rather than a state to reach.
      - name: Reject user-specific absolute home paths in history
        run: node scripts/check-local-paths.mjs --strict-history

      - name: Scan the working tree and the full history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pinned so a CI run and a local run apply the same rule set.
          GITLEAKS_VERSION: 8.30.1
          # Both of these would need write permissions this workflow does not
          # grant. The job summary and the failing exit code carry the result.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
